<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selects</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap');

  :root { --paper: #f2ede6; --ink: #1a1814; --muted: #8a8278; --rule: #d4cfc8;
    --select: #4a7c59; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--paper); }
  body { font-family: 'EB Garamond', Georgia, serif; background: var(--paper); color: var(--ink); min-height: 100dvh; }

  header { padding: 3rem 2.5rem 2rem; border-bottom: 0.5px solid var(--rule); display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
  .header-left h1 { font-family: 'EB Garamond', serif; font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 400; letter-spacing: 0.01em; line-height: 1; }
  .header-left .subtitle { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 0.4rem; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.75rem; }
  .voter-toggle { display: flex; border: 0.5px solid var(--rule); }
  .voter-btn { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 300; letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 16px; background: transparent; border: none; cursor: pointer; color: var(--muted); transition: all 0.15s; }
  .voter-btn + .voter-btn { border-left: 0.5px solid var(--rule); }
  .voter-btn.active { background: var(--ink); color: var(--paper); }
  .tally { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 300; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }

  nav { padding: 1rem 2.5rem; border-bottom: 0.5px solid var(--rule); display: flex; justify-content: center; }
  .filter-btn { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 300; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 14px; background: transparent; border: none; cursor: pointer; color: var(--muted); transition: color 0.15s; position: relative; }
  .filter-btn::after { content: ''; position: absolute; bottom: -1px; left: 14px; right: 14px; height: 1px; background: var(--ink); opacity: 0; transition: opacity 0.15s; }
  .filter-btn.active { color: var(--ink); }
  .filter-btn.active::after { opacity: 1; }

  main { padding: 0 2.5rem 4rem; }
  .section { margin-top: 3rem; }
  .section-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); padding-bottom: 1rem; border-bottom: 0.5px solid var(--rule); margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: baseline; }
  .section-count { font-size: 9px; letter-spacing: 0.08em; }

  .grid { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start; }

  /* Each thumb gets its flex-basis set by JS based on natural image ratio */
  .thumb {
    position: relative;
    cursor: pointer;
    overflow: hidden;
    height: 220px;
    flex-grow: 1;
    background: var(--paper);
  }

  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; transition: opacity 0.2s; }
  .thumb:hover img { opacity: 0.88; }

  .thumb::after { content: ''; position: absolute; inset: 0; border: 2px solid transparent; transition: border-color 0.15s; pointer-events: none; }
  .thumb.voted-mine::after  { border-color: var(--select); }
  .thumb.voted-other::after { border-color: var(--muted); }
  .thumb.voted-both::after  { border-color: var(--select); }

  .check { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; background: var(--select); display: none; align-items: center; justify-content: center; }
  .check svg { width: 10px; height: 10px; stroke: var(--paper); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .thumb.voted-mine .check, .thumb.voted-both .check { display: flex; }

  .both-dot { position: absolute; top: 8px; left: 8px; width: 6px; height: 6px; background: var(--paper); border-radius: 50%; display: none; }
  .thumb.voted-both .both-dot { display: block; }

  .empty-state { font-family: 'EB Garamond', serif; font-style: italic; color: var(--muted); font-size: 1.1rem; padding: 3rem 0; text-align: center; width: 100%; }

  .combined-section { margin-top: 4rem; padding-top: 2rem; border-top: 0.5px solid var(--rule); }
  .combined-label { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: baseline; }

  @media (max-width: 600px) {
    header { padding: 2rem 1.25rem 1.5rem; }
    nav { padding: 0.75rem 1.25rem; }
    main { padding: 0 1.25rem 3rem; }
    .thumb { height: 150px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Save the Date</h1>
    <p class="subtitle">Tap to select &nbsp;&mdash;&nbsp; selections save automatically</p>
  </div>
  <div class="header-right">
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span style="font-family:'DM Mono',monospace;font-size:9px;font-weight:300;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">Viewing as</span><div class="voter-toggle">
      <button class="voter-btn active" id="btn-carly" onclick="setVoter('carly')">Carly</button>
      <button class="voter-btn" id="btn-james" onclick="setVoter('james')">James</button>
      <button class="voter-btn" id="btn-bff" onclick="setVoter('bff')">BFF</button>
    </div></div>
    <span class="tally" id="tally">0 selected</span>
  </div>
</header>

<nav>
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('selected',this)">My picks</button>
  <button class="filter-btn" onclick="setFilter('agreed',this)">Agreed</button>
</nav>

<main id="main"></main>

<script>
const SUPABASE_URL = 'https://qkpbcxlngwnlndlwdvqc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFrcGJjeGxuZ3dubG5kbHdkdnFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0Mjk2MzgsImV4cCI6MjA5NjAwNTYzOH0.6Y_mmdMrWVMpNxUTPwyoE-aBz_4aZFXEIO8qG9HITHo';
const CLIENT = 'carly-james-std';
const BASE = 'https://skinnybonesjones.biz/save-the-date';
const ROW_HEIGHT = 220;

const TIERS = [
  { id: 'first',  label: 'I',   count: 34,  prefix: 'tier-1' },
  { id: 'second', label: 'II',  count: 105, prefix: 'tier-2' },
  { id: 'third',  label: 'III', count: 72,  prefix: 'tier-3' }
];

const images = [];
TIERS.forEach(t => {
  for(let i = 1; i <= t.count; i++) {
    images.push({ id: `${t.id}-${i}`, src: `${BASE}/${t.id}/${t.prefix}-${i}.jpg`, tier: t.id, tierLabel: t.label });
  }
});

// Cache natural ratios so we only load each image once
const ratioCache = {};

let voter = 'carly';
let filter = 'all';
let votes = {};

async function sbFetch(path, opts={}) {
  const res = await fetch(SUPABASE_URL + path, {
    ...opts,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      ...(opts.headers||{})
    }
  });
  if(!res.ok && res.status !== 204) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

async function loadVotes() {
  try {
    const data = await sbFetch(`/rest/v1/votes?client=eq.${CLIENT}&select=image_id,voter,selected`);
    votes = {};
    data.forEach(r => {
      if(!votes[r.image_id]) votes[r.image_id] = {};
      votes[r.image_id][r.voter] = r.selected;
    });
  } catch(e) { console.error('load failed', e); }
}

async function saveVote(imageId, selected) {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/votes', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({ client: CLIENT, image_id: imageId, voter, selected })
    });
    if(!res.ok) {
      const err = await res.text();
      console.error('save failed', res.status, err);
    }
  } catch(e) { console.error('save failed', e); }
}

function getState(id) {
  const v = votes[id] || {};
  const mine = !!v[voter];
  const others = ['carly','james','bff'].filter(x => x !== voter).some(x => v[x]);
  if(mine && others) return 'voted-both';
  if(mine) return 'voted-mine';
  if(others) return 'voted-other';
  return '';
}

function setVoter(v) {
  voter = v;
  ['carly','james','bff'].forEach(x => {
    document.getElementById('btn-'+x).classList.toggle('active', x === v);
  });
  render();
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function toggle(id) {
  if(!votes[id]) votes[id] = {};
  const current = !!votes[id][voter];
  votes[id][voter] = !current;
  updateThumb(id);
  updateTally();
  updateCombined();
  await saveVote(id, !current);
}

function updateThumb(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if(!el) return;
  const s = getState(id);
  el.className = 'thumb' + (s ? ' ' + s : '');
}

function updateTally() {
  const count = images.filter(img => votes[img.id] && votes[img.id][voter]).length;
  document.getElementById('tally').textContent = count + ' selected';
}

function makeThumb(img) {
  const s = getState(img.id);
  const div = document.createElement('div');
  div.className = 'thumb' + (s ? ' ' + s : '');
  div.dataset.id = img.id;
  div.onclick = () => toggle(img.id);

  // Set flex-basis from cache if available, otherwise set after load
  if(ratioCache[img.id]) {
    div.style.flexBasis = (ROW_HEIGHT * ratioCache[img.id]) + 'px';
  } else {
    div.style.flexBasis = '150px'; // placeholder until loaded
  }

  const imgEl = document.createElement('img');
  imgEl.src = img.src;
  imgEl.loading = 'lazy';
  imgEl.alt = '';

  imgEl.addEventListener('load', function() {
    if(this.naturalWidth && this.naturalHeight) {
      const ratio = this.naturalWidth / this.naturalHeight;
      ratioCache[img.id] = ratio;
      div.style.flexBasis = (ROW_HEIGHT * ratio) + 'px';
    }
  });

  div.innerHTML = `<div class="check"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></div><div class="both-dot"></div>`;
  div.insertBefore(imgEl, div.firstChild);
  return div;
}

function updateCombined() {
  const agreed = images.filter(img => {
    const v = votes[img.id] || {};
    return ['carly','james','bff'].filter(x => v[x]).length >= 2;
  });
  const section = document.getElementById('combined-section');
  if(!section) return;
  if(agreed.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  const count = document.getElementById('combined-count');
  const grid = document.getElementById('combined-grid');
  if(count) count.textContent = agreed.length;
  grid.innerHTML = '';
  agreed.forEach(img => grid.appendChild(makeThumb(img)));
}

function makeSection(imgs, labelText) {
  const section = document.createElement('div');
  section.className = 'section';
  const label = document.createElement('div');
  label.className = 'section-label';
  label.innerHTML = `<span>${labelText}</span><span class="section-count">${imgs.length}</span>`;
  const grid = document.createElement('div');
  grid.className = 'grid';
  imgs.forEach(img => grid.appendChild(makeThumb(img)));
  section.appendChild(label);
  section.appendChild(grid);
  return section;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  if(filter === 'all') {
    TIERS.forEach(tier => {
      const tierImgs = images.filter(img => img.tier === tier.id);
      main.appendChild(makeSection(tierImgs, tier.label));
    });

    const combined = document.createElement('div');
    combined.className = 'combined-section';
    combined.id = 'combined-section';
    combined.style.display = 'none';
    combined.innerHTML = `
      <div class="combined-label">
        <span>Agreed &nbsp;&mdash;&nbsp; selected by more than one</span>
        <span id="combined-count">0</span>
      </div>
      <div class="grid" id="combined-grid"></div>
    `;
    main.appendChild(combined);
    updateCombined();

  } else {
    let filtered;
    if(filter === 'selected') {
      filtered = images.filter(img => votes[img.id] && votes[img.id][voter]);
    } else {
      filtered = images.filter(img => {
        const v = votes[img.id] || {};
        return ['carly','james','bff'].filter(x => v[x]).length >= 2;
      });
    }

    if(filtered.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = filter === 'selected' ? 'Nothing selected yet.' : 'No images agreed on yet.';
      main.appendChild(empty);
    } else {
      main.appendChild(makeSection(filtered, filter === 'selected' ? 'My picks' : 'Agreed'));
    }
  }

  updateTally();
}

async function init() {
  await loadVotes();
  render();
}

init();
</script>
</body>
</html>
